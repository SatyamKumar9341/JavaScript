<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color: #fff;" >
    
</body>
<script>
    const div = document.createElement("div")   // creating html element by dom
    console.log(div)

    div.className = "main"
    div.id = Math.round(Math.random()*10 + 1)    // giving an random id
    
    div.setAttribute("title", "generatedTitle")   
    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    // div.innerText = "Satyam Kumar"   // round trip to overwrite
    const addText = document.createTextNode("Satyam Kumar")
    div.appendChild(addText)    // optimized way to overwrite

    document.body.appendChild(div)
    




</script>
</html>
