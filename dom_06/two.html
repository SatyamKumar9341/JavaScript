<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | chai aur code</title>
</head>
<body style="background-color: #212121; color: #fff">
    <div class="parent">
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
    </div>

<script>
    const parent = document.querySelector(".parent")
    // console.log(parent)
    // console.log(parent.children)
    // console.log(parent.children[1].innerHTML)

    for(let i=0; i<parent.children.length; i++){   // iteration over children's of class parent
        console.log(parent.children[i].innerHTML)

    }

    parent.children[1].style.color = "orange" 
    console.log(parent.firstElementChild)  // select's first child
    console.log(parent.lastElementChild)  // select's last child

    const dayOne = document.querySelector(".day")   // select's first child
    console.log(dayOne)
    console.log(dayOne.parentElement)       // select's parent of that child
    console.log(dayOne.nextElementSibling)  // select's next child of same parent 
    
    console.log("NODES: ", parent.childNodes )

</script>


</body>
</html>
